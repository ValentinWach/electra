name: Deploy to Prod

on:
  push:
    branches:
      - main

jobs:

  prod-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }} << 'EOF'
            cd /home/wach/electra/PROD
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/github
            git pull origin ${{ github.ref }}  # Holen des spezifischen Tags
            docker compose -p electra-prod up --build -d
          EOF
